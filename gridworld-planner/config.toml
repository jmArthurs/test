# LLM planner settings. Switch between the Claude API and a local model with `backend`.
# The --backend flag of the evaluation script overrides this.
[llm]
backend = "api"            # "api" (Claude API, needs ANTHROPIC_API_KEY) or "local" (Ollama)

[llm.api]
model = "claude-opus-5-5"
effort = "medium"          # low | medium | high | xhigh | max -- more effort = more thinking tokens
max_tokens = 16000
max_retries = 5
fallbacks = true           # if the model declines, the API retries on a fallback model; logged in `model`

[llm.local]
model = "llama3.1:8b"      # any model you have pulled: `ollama pull llama3.1:8b`
base_url = "http://localhost:11434"
temperature = 0.7
num_predict = 1024
timeout = 300.0
