[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmodel"
version = "0.1.0"
description = "Base project for training latent world models (JEPA + Dreamer) in 3D environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["imageio>=2.30", "pillow>=10.0", "tensorboard>=2.14"]
gym = ["gymnasium>=0.29", "mujoco>=3.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["worldmodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
